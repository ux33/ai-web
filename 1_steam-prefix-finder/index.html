<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Steam Prefix Finder</title>

<style>
    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        padding: 40px;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #171a21;
        color: #eee;
    }

    h1 {
        color: #66c0f4;
        margin-top: 0;
    }

    #dropZone {
        border: 2px dashed #66c0f4;
        border-radius: 12px;
        padding: 60px 20px;
        text-align: center;
        background: #1b2838;
        cursor: pointer;
        transition: 0.2s;
        margin: 25px 0;
    }

    #dropZone:hover,
    #dropZone.dragover {
        background: #243b55;
        border-color: #a4d007;
    }

    #dropZone.dragover {
        transform: scale(1.01);
    }

    #dropZone strong {
        display: block;
        font-size: 22px;
        margin-bottom: 10px;
        color: #66c0f4;
    }

    #dropZone span {
        color: #aaa;
    }

    #fileInput {
        display: none;
    }

    #status {
        margin: 15px 0;
        color: #aaa;
    }

    #search {
        display: none;
        width: 100%;
        padding: 12px;
        margin: 20px 0 10px;
        border: 1px solid #444;
        border-radius: 6px;
        background: #101216;
        color: white;
        font-size: 16px;
    }

    table {
        width: 100%;
        border-collapse: collapse;
        margin-top: 15px;
    }

    th, td {
        padding: 10px;
        border: 1px solid #444;
        text-align: left;
        vertical-align: top;
    }

    th {
        background: #1b2838;
        color: #66c0f4;
        position: sticky;
        top: 0;
    }

    tr:nth-child(even) {
        background: #1d2028;
    }

    tr:hover {
        background: #26394d;
    }

    code {
        color: #a4d007;
        word-break: break-all;
    }

    .copy {
        cursor: pointer;
        color: #66c0f4;
        text-decoration: underline;
    }

    .copy:hover {
        color: #a4d007;
    }
</style>
</head>

<body>

<h1>Steam Prefix Finder</h1>

<div id="dropZone">
    <strong>Перетащи сюда shortcuts.vdf</strong>
    <span>или нажми, чтобы выбрать файл</span>
</div>

<input type="file" id="fileInput" accept=".vdf">

<div id="status"></div>

<input
    type="text"
    id="search"
    placeholder="Поиск по названию или AppID..."
>

<table id="table" style="display:none">
    <thead>
        <tr>
            <th>AppID</th>
            <th>Игра</th>
            <th>EXE</th>
            <th>Prefix</th>
        </tr>
    </thead>
    <tbody id="tbody"></tbody>
</table>

<script>

const dropZone = document.getElementById("dropZone");
const fileInput = document.getElementById("fileInput");
const status = document.getElementById("status");
const table = document.getElementById("table");
const tbody = document.getElementById("tbody");
const search = document.getElementById("search");


// ---------------------------------------------------------
// Drag & Drop
// ---------------------------------------------------------

dropZone.addEventListener("click", () => {
    fileInput.click();
});

fileInput.addEventListener("change", () => {
    if (fileInput.files.length) {
        processFile(fileInput.files[0]);
    }
});

dropZone.addEventListener("dragover", (event) => {
    event.preventDefault();
    event.stopPropagation();

    dropZone.classList.add("dragover");
});

dropZone.addEventListener("dragleave", (event) => {
    event.preventDefault();
    event.stopPropagation();

    dropZone.classList.remove("dragover");
});

dropZone.addEventListener("drop", (event) => {
    event.preventDefault();
    event.stopPropagation();

    dropZone.classList.remove("dragover");

    const files = event.dataTransfer.files;

    if (!files.length)
        return;

    processFile(files[0]);
});


// ---------------------------------------------------------
// VDF parser
// ---------------------------------------------------------

function readCString(bytes, state) {

    const start = state.pos;

    while (
        state.pos < bytes.length &&
        bytes[state.pos] !== 0
    ) {
        state.pos++;
    }

    const value = new TextDecoder("utf-8").decode(
        bytes.slice(start, state.pos)
    );

    state.pos++;

    return value;
}


function readMap(bytes, state) {

    const result = {};

    while (state.pos < bytes.length) {

        const type = bytes[state.pos++];

        // End of object
        if (type === 0x08)
            break;

        const key = readCString(bytes, state);

        switch (type) {

            // Nested object
            case 0x00:
                result[key] = readMap(bytes, state);
                break;

            // String
            case 0x01:
                result[key] = readCString(bytes, state);
                break;

            // uint32
            case 0x02:

                if (state.pos + 4 > bytes.length) {
                    throw new Error("Повреждённый VDF");
                }

                result[key] =
                    (bytes[state.pos]) |
                    (bytes[state.pos + 1] << 8) |
                    (bytes[state.pos + 2] << 16) |
                    (bytes[state.pos + 3] << 24);

                result[key] >>>= 0;

                state.pos += 4;

                break;

            default:
                throw new Error(
                    "Неизвестный тип VDF: 0x" +
                    type.toString(16)
                );
        }
    }

    return result;
}


// ---------------------------------------------------------
// Process file
// ---------------------------------------------------------

async function processFile(file) {

    status.textContent = "Читаю " + file.name + "...";

    table.style.display = "none";
    search.style.display = "none";
    tbody.innerHTML = "";

    try {

        const buffer = await file.arrayBuffer();
        const bytes = new Uint8Array(buffer);

        const state = { pos: 0 };

        const root = readMap(bytes, state);

        const shortcuts = root.shortcuts || {};

        const games = Object.values(shortcuts);

        let count = 0;

        for (const game of games) {

            if (!game || typeof game !== "object")
                continue;

            const appid = game.appid;

            if (appid === undefined)
                continue;

            const name =
                game.AppName ||
                "Без названия";

            const exe =
                cleanPath(game.Exe || "");

            const prefix =
                "~/.local/share/Steam/steamapps/compatdata/" +
                appid +
                "/pfx/";

            const row = document.createElement("tr");

            row.dataset.search =
                (
                    appid +
                    " " +
                    name +
                    " " +
                    exe
                ).toLowerCase();

            row.innerHTML = `
                <td>
                    <code>${escapeHtml(appid)}</code>
                </td>

                <td>
                    <strong>${escapeHtml(name)}</strong>
                </td>

                <td>
                    <code>${escapeHtml(exe)}</code>
                </td>

                <td>
                    <span
                        class="copy"
                        title="Нажми, чтобы скопировать"
                        data-copy="${escapeHtml(prefix)}"
                    >
                        <code>${escapeHtml(prefix)}</code>
                    </span>
                </td>
            `;

            tbody.appendChild(row);

            count++;
        }

        if (count === 0) {

            status.textContent =
                "В файле не найдено Non-Steam shortcuts.";

            return;
        }

        table.style.display = "table";
        search.style.display = "block";

        status.textContent =
            `Готово. Найдено игр: ${count}`;

    } catch (error) {

        status.textContent =
            "Ошибка: " + error.message;

        console.error(error);
    }
}


// ---------------------------------------------------------
// Search
// ---------------------------------------------------------

search.addEventListener("input", () => {

    const query =
        search.value.toLowerCase().trim();

    for (const row of tbody.children) {

        row.style.display =
            !query ||
            row.dataset.search.includes(query)
                ? ""
                : "none";
    }
});


// ---------------------------------------------------------
// Copy prefix
// ---------------------------------------------------------

document.addEventListener("click", async (event) => {

    const element =
        event.target.closest(".copy");

    if (!element)
        return;

    const text =
        element.dataset.copy;

    try {

        await navigator.clipboard.writeText(text);

        const old = element.innerHTML;

        element.innerHTML =
            '<span style="color:#a4d007">Скопировано!</span>';

        setTimeout(() => {
            element.innerHTML = old;
        }, 1000);

    } catch {
        alert(text);
    }
});


// ---------------------------------------------------------
// Helpers
// ---------------------------------------------------------

function cleanPath(path) {

    if (!path)
        return "";

    return path
        .replace(/^"+|"+$/g, "");
}


function escapeHtml(value) {

    return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
}

</script>

</body>
</html>
